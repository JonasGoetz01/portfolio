name: Images

# Pictures are dropped into assets/ — often through the GitHub web UI, which
# cannot convert anything. This turns whatever was added into AVIF and commits
# the result, so the site only ever serves the small format.
on:
  push:
    branches: [master]
    paths:
      - "assets/**"
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # Ubuntu still ships ImageMagick 6, which has no `magick` binary and no
      # dependable AVIF encoder. Devbox installs the same ImageMagick 7 that
      # devbox.lock pins for local development, so CI converts identically.
      - uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: "true"

      # --replace: the source is kept in git history, so the tree only needs
      # the AVIF. Already-converted files are skipped.
      - name: Convert to AVIF
        run: devbox run -- ./image-optimizer/convert.sh --replace assets

      - name: Commit
        run: |
          if git diff --quiet; then
            echo "Nothing to convert."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "🖼️ Convert new images to AVIF"
          git push
