name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: portfolio

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: portfolio/package.json

      # --frozen-lockfile: fail if bun.lock does not match package.json,
      # rather than silently resolving something else than local development.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Types
        run: bun run typecheck

      - name: Test
        run: bun run test

      # Also proves the content files parse and the required fields are present,
      # since the loaders throw during the build.
      - name: Build
        run: bun run build

  # Both audits need a browser and a production build, so they run separately
  # from the fast checks above rather than slowing every one of them down.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: portfolio/package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      # axe-core over every route, the keyboard path to the skip link, and the
      # mobile layout checks (no page may scroll sideways at 320px).
      - name: Accessibility and layout
        run: bun run test:browser

      - name: Upload accessibility report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: portfolio/playwright-report
          retention-days: 7

      # Performance, accessibility, best-practices and SEO budgets.
      - name: Lighthouse
        run: bun run test:lh
